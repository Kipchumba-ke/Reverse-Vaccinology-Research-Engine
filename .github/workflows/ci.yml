name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaccinology
          POSTGRES_PASSWORD: vaccinology_ci
          POSTGRES_DB: reverse_vaccinology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaccinology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Submitting an analysis enqueues a Celery job, which needs a broker.
      # Without Redis, POST /api/analyses returns 500 instead of 202.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DATABASE_URL: postgresql+psycopg://vaccinology:vaccinology_ci@localhost:5432/reverse_vaccinology
      TEST_DATABASE_URL: postgresql+psycopg://vaccinology:vaccinology_ci@localhost:5432/reverse_vaccinology
      JWT_SECRET_KEY: ci-only-secret-for-tests-0123456789abcdef
      RATE_LIMIT_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # poppler-utils provides pdftotext, which the PDF report test uses.
      - name: Install BLAST+, Clustal Omega and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+ clustalo poppler-utils

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Create database tables
        run: |
          cp alembic.ini.example alembic.ini
          alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - run: npm test -- --run

      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t reversevax-api .

      - name: Build web image
        run: docker build -t reversevax-web frontend
