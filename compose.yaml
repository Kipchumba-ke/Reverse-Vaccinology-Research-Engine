# Development services (Postgres and Redis) start by default:
#   docker compose up -d
#
# The full stack (migrations, API, worker, web) is opt-in:
#   docker compose --profile app up --build
# It needs JWT_SECRET_KEY in your environment or .env file, and your host
# BLAST databases under ./data/reference (mounted read-only).
#
# Production: set POSTGRES_PASSWORD and JWT_SECRET_KEY to your own values (the
# defaults here are for local development only), put a TLS-terminating reverse
# proxy in front of the web service, and set CORS_ALLOWED_ORIGINS to your
# site's address. Postgres and Redis are published on 127.0.0.1 only; remove
# those ports entirely if nothing on the host needs them.
# To use DeepTMHMM or SignalP through BioLib inside the containers, build with
# INSTALL_BIOLIB=1 and set BIOLIB_TOKEN.

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://vaccinology:${POSTGRES_PASSWORD:-vaccinology_dev}@postgres:5432/reverse_vaccinology
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
  TRUSTED_PROXY_COUNT: "1"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  HOST_PEPTIDE_SCAN: ${HOST_PEPTIDE_SCAN:-0}
  # Optional predictors (all off unless you switch them on in .env). The
  # settings below pass straight through; see .env.example for what each does.
  BIOLIB_TOKEN: ${BIOLIB_TOKEN:-}
  DEEPTMHMM_ENABLED: ${DEEPTMHMM_ENABLED:-0}
  SIGNALP_ENABLED: ${SIGNALP_ENABLED:-0}
  SIGNALP_BACKEND: ${SIGNALP_BACKEND:-local}
  SIGNALP_BIOLIB_APP: ${SIGNALP_BIOLIB_APP:-DTU/SignalP_6}
  SIGNALP_ORGANISM: ${SIGNALP_ORGANISM:-other}
  PSORTB_ENABLED: ${PSORTB_ENABLED:-0}
  PSORTB_BACKEND: ${PSORTB_BACKEND:-local}
  PSORTB_EXECUTABLE: ${PSORTB_EXECUTABLE:-}
  PSORTB_GRAM: ${PSORTB_GRAM:-negative}
  IEDB_ENABLED: ${IEDB_ENABLED:-0}
  IEDB_MHCI_ALLELES: ${IEDB_MHCI_ALLELES:-}
  IEDB_MHCII_ALLELES: ${IEDB_MHCII_ALLELES:-}
  IEDB_MHCI_LENGTH: ${IEDB_MHCI_LENGTH:-9}
  IEDB_MHCII_LENGTH: ${IEDB_MHCII_LENGTH:-15}
  IEDB_MHCI_RANK_CUTOFF: ${IEDB_MHCI_RANK_CUTOFF:-1}
  IEDB_MHCII_RANK_CUTOFF: ${IEDB_MHCII_RANK_CUTOFF:-10}
  IEDB_MAX_SEQUENCE_LENGTH: ${IEDB_MAX_SEQUENCE_LENGTH:-1500}
  ALIGNMENT_SCORING: ${ALIGNMENT_SCORING:-blosum62}
  # Access and limits. The web app submits through /api/analyses, so the
  # synchronous route is off here; set REGISTRATION_ENABLED=0 once your users
  # have accounts.
  SYNC_ANALYZE_ENABLED: ${SYNC_ANALYZE_ENABLED:-0}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-1}
  ANALYSIS_SOFT_TIME_LIMIT_SECONDS: ${ANALYSIS_SOFT_TIME_LIMIT_SECONDS:-3300}
  ANALYSIS_TIME_LIMIT_SECONDS: ${ANALYSIS_TIME_LIMIT_SECONDS:-3600}
  PSORTB_TIMEOUT_SECONDS: ${PSORTB_TIMEOUT_SECONDS:-1800}

services:
  postgres:
    image: postgres:16
    container_name: reverse-vaccinology-db
    environment:
      POSTGRES_DB: reverse_vaccinology
      POSTGRES_USER: vaccinology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaccinology_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaccinology -d reverse_vaccinology"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: reverse-vaccinology-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      args:
        INSTALL_BIOLIB: ${INSTALL_BIOLIB:-0}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: .
      args:
        INSTALL_BIOLIB: ${INSTALL_BIOLIB:-0}
    environment: *backend-environment
    volumes:
      - ./data/reference:/srv/app/data/reference:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    profiles: ["app"]
    build:
      context: .
      args:
        INSTALL_BIOLIB: ${INSTALL_BIOLIB:-0}
    command: ["celery", "-A", "app.services.celery_queue.celery_app", "worker", "--loglevel=info"]
    environment: *backend-environment
    volumes:
      - ./data/reference:/srv/app/data/reference:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
