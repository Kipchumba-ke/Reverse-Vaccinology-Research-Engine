services:
  postgres:
    image: postgres:16
    container_name: reverse-vaccinology-db
    environment:
      POSTGRES_DB: reverse_vaccinology
      POSTGRES_USER: vaccinology
      POSTGRES_PASSWORD: vaccinology_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: